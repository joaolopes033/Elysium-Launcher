<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elysium Launcher</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <header class="titlebar" id="titlebar">
      <div class="titlebar-drag">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M12 2 L21 7.5 V16.5 L12 22 L3 16.5 V7.5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M12 2 V22 M3 7.5 L21 16.5 M21 7.5 L3 16.5" stroke="currentColor" stroke-width="1" opacity="0.45"/>
            </svg>
          </span>
          <span class="brand-name">ELYSIUM<b>LAUNCHER</b></span>
        </div>
      </div>
      <div class="titlebar-controls">
        <button class="win-btn" id="btn-minimize" title="Minimizar" aria-label="Minimizar">
          <svg viewBox="0 0 10 10" width="10" height="10"><rect x="0" y="4.5" width="10" height="1"/></svg>
        </button>
        <button class="win-btn" id="btn-maximize" title="Maximizar" aria-label="Maximizar">
          <svg viewBox="0 0 10 10" width="10" height="10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg>
        </button>
        <button class="win-btn win-btn-close" id="btn-close" title="Fechar" aria-label="Fechar">
          <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </header>

    <div class="shell">
      <nav class="sidebar" aria-label="Navegacao principal">
        <button class="nav-item" data-view="home" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
          </span>
          <span>Início</span>
        </button>
        <button class="nav-item" data-view="store">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 5.5 4h13L20 8"/><path d="M4 8h16v11H4z"/><path d="M9 8v3a3 3 0 0 0 6 0V8"/></svg>
          </span>
          <span>Loja</span>
        </button>
        <button class="nav-item" data-view="library">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="4.5" height="16" rx="0.6"/><rect x="10.2" y="4" width="4.5" height="16" rx="0.6"/><path d="M16.8 5.2 20.3 6.4 17.3 19.8 13.9 18.6z"/></svg>
          </span>
          <span>Biblioteca</span>
        </button>
        <button class="nav-item" data-view="downloads">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 11 12 15.5 16.5 11"/><path d="M4.5 18h15"/></svg>
          </span>
          <span>Downloads</span>
          <span class="nav-badge" id="downloads-badge" hidden>0</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.6"/><path d="M12 3.5v2.3M12 18.2v2.3M20.5 12h-2.3M5.8 12H3.5M17.7 6.3l-1.6 1.6M7.9 16.1l-1.6 1.6M17.7 17.7l-1.6-1.6M7.9 7.9 6.3 6.3"/></svg>
          </span>
          <span>Configurações</span>
        </button>

        <div class="sidebar-spacer"></div>
        <div class="sidebar-footer">
          <span class="dot dot-ok" aria-hidden="true"></span>
          <span>Catálogo · <span id="catalog-count">–</span> jogos</span>
        </div>
      </nav>

      <main id="view-root" class="view-root" tabindex="-1"></main>
    </div>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
